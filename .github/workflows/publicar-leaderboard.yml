# Mantem o leaderboard publico em dia sem etapa manual.
#
# A pagina publica mora no repositorio blacksheep-invitational (o GitHub Pages
# aceita um dominio por repositorio, e este ja usa dashboard.bjjblacksheepfit.com).
# A fonte continua aqui: src/leaderboard-fonte.html gera publico/index.html.
# A cada push na main que mexa nesse arquivo, ele e copiado para la.
#
# Precisa do segredo INVITATIONAL_TOKEN — uma credencial com permissao de escrita
# em blacksheep-invitational. Sem ela o job FALHA, de proposito: uma copia que nao
# acontece em silencio vira leaderboard desatualizado no ar sem ninguem perceber.

name: Publicar leaderboard publico

on:
  push:
    branches: [main]
    paths: ['publico/index.html']
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Conferir a credencial
        env:
          TOKEN: ${{ secrets.INVITATIONAL_TOKEN }}
        run: |
          if [ -z "${TOKEN:-}" ]; then
            echo "::error::Segredo INVITATIONAL_TOKEN ausente ou vazio. O leaderboard publico" \
                 "NAO foi atualizado — invitational.bjjblacksheepfit.com segue com a versao anterior." \
                 "Configure em Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Baixar este repositorio
        uses: actions/checkout@v4

      - name: Copiar para o blacksheep-invitational
        env:
          TOKEN: ${{ secrets.INVITATIONAL_TOKEN }}
        run: |
          set -euo pipefail
          git clone --depth 1 \
            "https://x-access-token:${TOKEN}@github.com/fernandorebane-code/blacksheep-invitational.git" \
            destino
          # so o index.html: o CNAME e do Pages e nao pode ser tocado
          cp publico/index.html destino/index.html
          cd destino
          if git diff --quiet -- index.html; then
            echo "O leaderboard publico ja esta igual a fonte. Nada a fazer."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Sincroniza o leaderboard publico (fonte: ${GITHUB_SHA:0:7})"
          git push
          echo "Publicado em invitational.bjjblacksheepfit.com."
