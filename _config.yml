# Arquivos que ficam no repositorio mas nao vao para o site publicado.
# src/leaderboard-fonte.html e a fonte das duas paginas (ver build-paginas.py):
# ela junta leaderboard publico e painel do organizador, entao nao pode ser
# servida como pagina — seria uma terceira porta para o login da organizacao.
exclude:
  - src
  - publico
  # sites/ sao as paginas prontas de outros campeonatos (ver eventos/).
  # Elas TAMBEM sao servidas daqui, de proposito: o Pages deste repositorio ja
  # esta no ar, entao e o caminho que poe um evento no ar sem depender de
  # ninguem rodar deploy. O endereco proprio do evento (ctstorm-leaderboard.web.app)
  # serve os mesmos arquivos; este aqui e a rede de seguranca.
  - eventos
  - build-paginas.py
  - LEADERBOARD.md
  - testes
  # dados/ continua publicado: o organizador busca campeonato-inicial.json de la.
  # So o script que gera esse arquivo fica de fora.
  - dados/atualizar-atletas.py
  - dados/montar-provas.py
